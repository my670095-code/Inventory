<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Cafe ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <img src="https://placehold.co/400x90/1a7a4c/ffffff?text=Dr+Cafe+Coffee+%7C+SINCE+1997"
                 alt="Dr Cafe Coffee"
                 class="login-brand-img">
        </div>

        <div class="login-sub">Sign in to continue</div>
        <div id="loginError" class="login-error"></div>

        <div class="field">
            <label>Username</label>
            <input type="text" id="loginUser" placeholder="Username">
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Password">
        </div>

        <button class="login-btn" onclick="doLogin()">Sign In</button>
    </div>
</div>

<!-- APP -->
<div id="appScreen" style="display:none">
<div class="sidebar">
    <div class="logo"><span>Dr Cafe</span> ERP</div>
    <div id="sidebarMenu"></div>
</div>
<div class="main">
   <div class="topbar">
    <div class="page-title" id="pageTitle">Dashboard</div>
    <div id="pwBanner" style="display:none;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold">
        ⚠ Using default password — <a onclick="openChangePassword()" style="color:#78350f;text-decoration:underline;cursor:pointer">change it now</a>
    </div>
        <div class="user">
            <div class="user-info"><b id="userName">—</b><div class="role-tag" id="userRole">—</div></div>
            <div class="avatar" id="userAvatar">—</div>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>
    </div>
    <div class="content"><div id="pageContainer"></div></div>
</div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalBox">
        <div class="modal-header"><h3 id="modalTitle">Title</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #1f2937; }

/* ================= LOGIN ================= */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #0f172a, #1e293b); padding:20px; }
.login-card { background:white; border-radius:16px; padding:40px 38px 34px; width:100%; max-width:440px; box-shadow:0 24px 70px rgba(0,0,0,0.4); }

.login-brand {
    text-align: center;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid #e5e7eb;
}
.login-brand-img {
    max-width: 100%;
    width: 320px;
    height: auto;
    display: inline-block;
}

.login-sub { text-align:center; color:#6b7280; font-size:13px; margin-bottom:26px; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:12px; font-weight:bold; color:#374151; margin-bottom:6px; }
.field input { width:100%; padding:12px 14px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; font-family:inherit; }
.field input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
.login-btn { width:100%; padding:13px; background:#1a7a4c; color:white; border:none; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; margin-top:8px; letter-spacing: 0.3px; }
.login-btn:hover { background:#156239; }
.login-error { background:#fee2e2; color:#b91c1c; padding:10px; border-radius:6px; font-size:13px; margin-bottom:14px; display:none; }

/* ================= SIDEBAR ================= */
.sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 245px;
    background: #111827;
    color: white;
    overflow-y: auto;
    z-index: 100;
}
.logo {
    padding: 22px 20px;
    font-size: 19px;
    font-weight: bold;
    border-bottom: 1px solid #374151;
    letter-spacing: 0.3px;
}
.logo span { color: #4ade80; }
.menu-title {
    padding: 20px 20px 8px;
    font-size: 11px;
    text-transform: uppercase;
    color: #9ca3af;
    letter-spacing: 1px;
}
.menu-item {
    padding: 11px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #d1d5db;
    border-left: 3px solid transparent;
    line-height: 1.4;
}
.menu-item:hover { background: #1f2937; color: white; }
.menu-item.active {
    background: #1f2937;
    color: white;
    border-left: 3px solid #4ade80;
}
.menu-icon {
    width: 24px;
    min-width: 24px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
}
.menu-item > span:not(.menu-pill) {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.menu-pill {
    background: #dc2626;
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
}

/* ================= MAIN ================= */
.main { margin-left:245px; min-height:100vh; }
.topbar { height:70px; background:white; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; padding:0 30px; position:sticky; top:0; z-index:50; }
.page-title { font-size:21px; font-weight:bold; }
.user { display:flex; align-items:center; gap:12px; }
.user-info { text-align:right; }
.user-info b { font-size:13px; }
.user-info .role-tag { font-size:11px; color:#2563eb; font-weight:bold; }
.avatar { width:40px; height:40px; background:#1a7a4c; color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; }
.logout-btn { padding:7px 12px; background:#f3f4f6; color:#374151; border:none; border-radius:6px; cursor:pointer; font-size:12px; }
.logout-btn:hover { background:#e5e7eb; }
.content { padding:25px 30px; }

.cards { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:25px; }
.card { background:white; border-radius:10px; padding:20px; border:1px solid #e5e7eb; }
.card-label { font-size:13px; color:#6b7280; margin-bottom:10px; }
.card-value { font-size:27px; font-weight:bold; }
.card-small { font-size:12px; margin-top:8px; color:#6b7280; }
.green { color:#16a34a; } .red { color:#dc2626; } .orange { color:#ea580c; } .blue { color:#2563eb; }

.grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:20px; margin-bottom:25px; }
.panel { background:white; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; margin-bottom:22px; }
.panel-header { padding:17px 20px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.panel-title { font-weight:bold; }
.panel-body { padding:20px; overflow-x:auto; }

table { width:100%; border-collapse:collapse; }
th { text-align:left; background:#f9fafb; color:#6b7280; font-size:12px; padding:12px; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
td { padding:13px 12px; border-bottom:1px solid #f0f0f0; font-size:13px; }
tr:hover { background:#fafafa; }
.empty { text-align:center; color:#9ca3af; padding:40px 20px; font-size:14px; }

.badge { padding:5px 9px; border-radius:20px; font-size:11px; font-weight:bold; white-space:nowrap; }
.badge-green { background:#dcfce7; color:#15803d; }
.badge-orange { background:#ffedd5; color:#c2410c; }
.badge-red { background:#fee2e2; color:#b91c1c; }
.badge-blue { background:#dbeafe; color:#1d4ed8; }
.badge-gray { background:#f3f4f6; color:#4b5563; }
.badge-purple { background:#ede9fe; color:#6d28d9; }
.badge-cyan { background:#cffafe; color:#0e7490; }

button { border:none; padding:9px 14px; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit; }
.btn-primary { background:#1a7a4c; color:white; }
.btn-primary:hover { background:#156239; }
.btn-light { background:#f3f4f6; color:#374151; }
.btn-light:hover { background:#e5e7eb; }
.btn-success { background:#16a34a; color:white; }
.btn-success:hover { background:#15803d; }
.btn-danger { background:#dc2626; color:white; }
.btn-danger:hover { background:#b91c1c; }
.btn-warn { background:#f59e0b; color:white; }
.btn-warn:hover { background:#d97706; }
.btn-sm { padding:6px 10px; font-size:12px; }
.btn-xs { padding:4px 8px; font-size:11px; }
button:disabled { opacity:0.5; cursor:not-allowed; }
.actions-cell { display:flex; gap:4px; flex-wrap:wrap; }

.page { display:none; }
.page.active { display:block; }
.toolbar { background:white; padding:15px; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
input, select { padding:9px 12px; border:1px solid #d1d5db; border-radius:6px; background:white; font-family:inherit; font-size:13px; }
input:focus, select:focus { outline:none; border-color:#1a7a4c; box-shadow:0 0 0 3px rgba(26,122,76,0.12); }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:white; border-radius:12px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 25px 60px rgba(0,0,0,0.3); }
.modal.modal-wide { max-width:820px; }
.modal.modal-xl { max-width:1500px; }
.modal-header { padding:20px 24px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:white; z-index:10; }
.modal-header h3 { font-size:17px; }
.modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:#6b7280; padding:0 6px; line-height:1; }
.modal-body { padding:22px 24px; }
.modal-footer { padding:16px 24px; border-top:1px solid #e5e7eb; display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:white; z-index:10; }
.form-row { margin-bottom:15px; }
.form-row label { display:block; font-size:12px; font-weight:bold; color:#374151; margin-bottom:6px; }
.form-row input, .form-row select, .form-row textarea { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:6px; font-family:inherit; font-size:13px; }
.form-row textarea { resize:vertical; min-height:70px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }

.line-editor { border:1px solid #e5e7eb; border-radius:8px; overflow:hidden; }
.line-editor table { font-size:13px; }
.line-editor th { background:#f3f4f6; font-size:11px; padding:8px 10px; }
.line-editor td { padding:6px 10px; }
.line-editor input, .line-editor select { width:100%; padding:6px 8px; font-size:12px; }
.line-editor select { min-width:180px; }

.journal-meta { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:14px 18px; margin-bottom:18px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.journal-meta .k { font-size:11px; color:#1e40af; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; font-weight:bold; }
.journal-meta .v { font-size:14px; font-weight:bold; color:#1f2937; }

.journal-table-wrap { max-height:52vh; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; }
.journal-table-wrap table { font-size:12.5px; }
.journal-table-wrap thead th { position:sticky; top:0; z-index:5; background:#f9fafb; font-size:11px; padding:9px 8px; }
.journal-table-wrap input { width:85px; padding:6px 8px; font-size:13px; text-align:right; }
.journal-table-wrap td { padding:7px 8px; }
.var-cell { font-weight:bold; text-align:right; font-size:13px; }
.var-ok { color:#16a34a; }
.var-warn { color:#ea580c; }
.var-bad { color:#dc2626; }
.readonly-cell { background:#f9fafb; text-align:right; padding:7px 8px; color:#4b5563; font-size:12.5px; }
.readonly-cell.bold { font-weight:bold; color:#1f2937; }
.readonly-cell.opening-src { background:#eff6ff; color:#1e40af; font-weight:bold; cursor:help; }
.readonly-cell.mtd { background:#f0fdf4; color:#166534; font-size:12px; }

.journal-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px; }
.journal-progress { font-size:12px; color:#6b7280; }
.journal-progress b { color:#1a7a4c; font-size:14px; }
.journal-search { padding:8px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; width:220px; }
.formula-badge { display:inline-block; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:bold; }

.upload-drop { border:2px dashed #cbd5e1; border-radius:10px; padding:40px 20px; text-align:center; background:#f9fafb; cursor:pointer; transition:all 0.2s; }

.upload-icon { font-size:42px; margin-bottom:12px; }

.upload-hint { font-size:12px; color:#6b7280; }
.upload-file { display:none; }

.reject-list div { padding:3px 0; border-bottom:1px dashed #fecaca; }

.toast { position:fixed; bottom:24px; right:24px; background:#111827; color:white; padding:14px 20px; border-radius:8px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,0.25); transform:translateY(120%); transition:transform 0.3s; z-index:400; max-width:380px; }
.toast.show { transform:translateY(0); }
.toast.success { background:#16a34a; }
.toast.error { background:#dc2626; }

.storage-bar { height:6px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:6px; }
.storage-bar-fill { height:100%; background:#1a7a4c; transition:width 0.3s; }
.storage-bar-fill.warn { background:#f59e0b; }
.storage-bar-fill.danger { background:#dc2626; }

.denied { background:#fee2e2; border:1px solid #fecaca; color:#b91c1c; padding:16px; border-radius:8px; font-size:13px; margin-bottom:18px; }
.scope-banner { background:#f0f9ff; border:1px solid #bae6fd; color:#0369a1; padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:12.5px; }
.scope-banner b { color:#075985; }

.dep-warning { background:#fef3c7; border:1px solid #fcd34d; color:#92400e; padding:14px; border-radius:8px; font-size:13px; margin-bottom:14px; }
.dep-warning b { color:#78350f; }
.dep-list { max-height:180px; overflow-y:auto; margin-top:8px; background:white; border-radius:6px; padding:10px; font-size:12px; }
.dep-list div { padding:4px 0; border-bottom:1px dashed #fde68a; }

.warn-box { background:#fef3c7; border:1px solid #fcd34d; border-radius:8px; padding:11px 14px; font-size:12.5px; color:#92400e; margin-bottom:14px; }
.warn-box a { color:#78350f; font-weight:bold; text-decoration:underline; cursor:pointer; }

.bom-card { background:white; border:1px solid #e5e7eb; border-radius:8px; padding:18px; margin-bottom:14px; }
.bom-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.bom-pid { font-family: monospace; font-size:12px; background:#eff6ff; color:#1e40af; padding:3px 8px; border-radius:6px; display:inline-block; font-weight:bold; }
.bom-item { display:flex; justify-content:space-between; padding:8px 12px; background:#f9fafb; margin-bottom:4px; font-size:13px; border-radius:5px; }
.bom-item .left { display:flex; gap:8px; align-items:center; }
.bom-item .code { font-family: monospace; font-size:11px; color:#6b7280; }

.info-block { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:14px 18px; font-size:13px; color:#1e40af; margin-bottom:16px; }
.info-block b { color:#1e3a8a; }

.upload-options { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; padding:16px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; }
.upload-options .form-row { margin-bottom:0; }

.gate-icon { font-size:42px; text-align:center; display:block; margin-bottom:12px; }
.gate-title { font-size:16px; font-weight:bold; color:#b91c1c; text-align:center; margin-bottom:14px; }
.gate-details { background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; padding:12px 14px; font-size:13px; line-height:1.9; margin-bottom:14px; }
.gate-details .k { color:#6b7280; display:inline-block; min-width:100px; }
.gate-hint { font-size:12.5px; color:#6b7280; margin-bottom:0; }

.pending-banner { background:#fef3c7; border:1px solid #fcd34d; border-radius:8px; padding:12px 16px; margin-bottom:16px; font-size:13px; color:#92400e; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
.pending-banner .count { background:#dc2626; color:white; padding:3px 10px; border-radius:12px; font-size:12px; }

@media(max-width:900px) {
    .sidebar { width:65px; }
    .logo { font-size:0; text-align:center; padding:22px 0; }
    .logo span { font-size:20px; }
    .menu-title, .menu-item > span { display:none; }
    .menu-item { justify-content:center; padding:15px 5px; }
    .main { margin-left:65px; }
    .cards { grid-template-columns:repeat(2,1fr); }
    .grid-2 { grid-template-columns:1fr; }
    .user-info { display:none; }
    .journal-meta { grid-template-columns:1fr 1fr; }
    .upload-options { grid-template-columns:1fr 1fr; }
}
@media(max-width:600px) {
    .cards { grid-template-columns:1fr; }
    .content { padding:15px; }
    .topbar { padding:0 15px; }
    .form-grid, .form-grid-3 { grid-template-columns:1fr; }
    .upload-options { grid-template-columns:1fr; }
}
</style>

let DB = null;
function isValidData(d){
    return d && typeof d==='object'
        && Array.isArray(d.users) && d.users.length > 0
        && Array.isArray(d.stores) && Array.isArray(d.items)
        && Array.isArray(d.journals) && Array.isArray(d.closedMonths)
        && d.users.every(u => u && u.username && u.pass);
}
async function loadData(){
    if (CLOUD_MODE === 'supabase') {
        return await DataLayer.loadAll();
    }
    LEGACY_KEYS.forEach(k => { if (localStorage.getItem(k)) localStorage.removeItem(k); });
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const p = JSON.parse(raw);
            if (isValidData(p)) {
                if (!Array.isArray(p.voidedRecords)) p.voidedRecords = [];
                if (!Array.isArray(p.employees)) p.employees = [];
                if (!Array.isArray(p.salesUploads)) p.salesUploads = [];
                if (!Array.isArray(p.consumptionLedger)) p.consumptionLedger = [];
                if (!Array.isArray(p.transfers)) p.transfers = [];
                delete p.adjustments;
                return p;
            }
            localStorage.removeItem(STORAGE_KEY);
        }
    } catch(e) { localStorage.removeItem(STORAGE_KEY); }
    const fresh = defaultData();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
}
function saveData(){
    if (!DB) return;
    DB.meta.lastSaved = nowISO();
    if (CLOUD_MODE === 'supabase') return;   // cloud writes happen explicitly per mutation
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
    catch(e) { toast('Storage full!', 'error'); }
}

function nextMovementId(prefix, collection, dateStr){
    const [y,m,d] = dateStr.split('-');
    const tag = d + m + y;
    const full = `${prefix}-${tag}-`;
    let max = 0;
    collection.forEach(x => {
        if (x.id && x.id.startsWith(full)) {
            const n = parseInt(x.id.slice(full.length), 10);
            if (!isNaN(n) && n > max) max = n;
        }
    });
    return full + String(max + 1).padStart(4, '0');
}
function nextJournalNo(prefix, dateStr){ return nextMovementId(prefix, DB.journals, dateStr); }

const ENTITIES = {
    store: { key:'stores', label:'Store', nameField:'name' },
    item: { key:'items', label:'Item', nameField:'name' },
    bom: { key:'bom', label:'BOM', nameField:'productName' },
    employee: { key:'employees', label:'Employee', nameField:'name' },
    journal: { key:'journals', label:'Journal', nameField:'id' },
    openingStock: { key:'openingStock', label:'Opening Stock', nameField:'id' },
    purchase: { key:'purchases', label:'Purchase', nameField:'id' },
    salesUp: { key:'salesUploads', label:'Sales Upload', nameField:'id' },
    transfer: { key:'transfers', label:'Transfer', nameField:'id' },
    user: { key:'users', label:'User', nameField:'username' }
};
function getDeleteBlockers(entityType, id){
    const blockers = [];
    if (entityType === 'store') {
        const j = DB.journals.filter(x => x.storeId===id);
        if (j.length) blockers.push({ type:'Journal', count:j.length, preview:j.slice(0,5).map(x=>x.id) });
        const o = DB.openingStock.filter(x => x.storeId===id);
        if (o.length) blockers.push({ type:'Opening Stock', count:o.length, preview:o.slice(0,5).map(x=>x.id) });
        const p = DB.purchases.filter(x => x.storeId===id);
        if (p.length) blockers.push({ type:'Purchase', count:p.length, preview:p.slice(0,5).map(x=>x.id) });
        const s = DB.salesUploads.filter(x => x.storeId===id);
        if (s.length) blockers.push({ type:'Sales Upload', count:s.length, preview:s.slice(0,5).map(x=>x.id) });
    }
    if (entityType === 'item') {
        const item = getItem(id);
        if (item) {
            const bomUsing = DB.bom.filter(b => (b.lines||[]).some(l => l.itemId === id));
            if (bomUsing.length) blockers.push({ type:'BOM', count:bomUsing.length, preview:bomUsing.slice(0,5).map(b=>b.productId) });
            const journals = DB.journals.filter(j => j.lines.some(l => l.itemId===id));
            if (journals.length) blockers.push({ type:'Journal', count:journals.length, preview:journals.slice(0,5).map(j=>j.id) });
        }
    }
    if (entityType === 'employee') {
        const emp = getEmployee(id);
        if (emp) {
            const asSM = DB.stores.filter(s => norm(s.storeManagerName) === norm(emp.name));
            if (asSM.length) blockers.push({ type:'Store (Store Manager)', count:asSM.length, preview:asSM.slice(0,5).map(s=>s.code) });
            const asArea = DB.stores.filter(s => norm(s.areaManagerName) === norm(emp.name));
            if (asArea.length) blockers.push({ type:'Store (Area Manager)', count:asArea.length, preview:asArea.slice(0,5).map(s=>s.code) });
            const asOp = DB.stores.filter(s => norm(s.operationManagerName) === norm(emp.name));
            if (asOp.length) blockers.push({ type:'Store (Op Manager)', count:asOp.length, preview:asOp.slice(0,5).map(s=>s.code) });
        }
    }
    if (entityType === 'journal') {
        const j = DB.journals.find(x => x.id===id);
        if (j) {
            const later = DB.journals.filter(x => x.id !== id && x.storeId === j.storeId && x.status === 'Submitted' && x.createdAt > j.createdAt);
            if (later.length) blockers.push({ type:'Later Journal', count:later.length, preview:later.slice(0,5).map(x=>x.id) });
            if (isMonthClosed(j.storeId, j.month)) blockers.push({ type:'Closed Month', count:1, preview:[j.month] });
        }
    }
    if (entityType === 'openingStock') {
        const o = DB.openingStock.find(x => x.id===id);
        if (o) {
            const monthJournals = DB.journals.filter(j => j.storeId === o.storeId && j.month === o.month && j.status === 'Submitted');
            if (monthJournals.length) blockers.push({ type:'Journal', count:monthJournals.length, preview:monthJournals.slice(0,5).map(j=>j.id) });
            if (isMonthClosed(o.storeId, o.month)) blockers.push({ type:'Closed Month', count:1, preview:[o.month] });
        }
    }
    if (entityType === 'transfer') {
        const t = DB.transfers.find(x => x.id===id);
        if (t && t.status === 'Approved') blockers.push({ type:'Approved Transfer', count:1, preview:[t.id] });
    }
    return blockers;
}
function softDelete(entityType, id, reason){
    const reg = ENTITIES[entityType];
    if (!reg) return false;
    const col = DB[reg.key];
    const idx = col.findIndex(x => x.id === id);
    if (idx < 0) return false;
    const record = col[idx];
    DB.voidedRecords.push({
        id: uid('void'), entityType, originalId: id,
        label: record[reg.nameField] || id,
        snapshot: JSON.parse(JSON.stringify(record)),
        reason: reason || '', voidedAt: nowISO(),
        voidedById: currentUser()?.id, voidedByName: currentUser()?.name || 'system'
    });
    col.splice(idx, 1);
    if (entityType === 'salesUp') DB.consumptionLedger = DB.consumptionLedger.filter(x => x.uploadRef !== id);
    audit('VOID', entityType, id, { reason: reason || '' });
    saveData();
    return true;
}
function restoreVoided(voidId){
    const v = DB.voidedRecords.find(x => x.id === voidId);
    if (!v) return;
    const reg = ENTITIES[v.entityType];
    if (!reg) return;
    const collision = DB[reg.key].find(x => x.id === v.originalId);
    if (collision) v.snapshot.id = uid(reg.key.slice(0,3));
    DB[reg.key].push(JSON.parse(JSON.stringify(v.snapshot)));
    DB.voidedRecords = DB.voidedRecords.filter(x => x.id !== voidId);
    audit('RESTORE', v.entityType, v.originalId, {});
    saveData();
    toast('Restored', 'success');
}
function purgeVoided(voidId){
    const v = DB.voidedRecords.find(x => x.id === voidId);
    if (!v) return;
    if (!confirm(`Permanently delete "${v.label}"?`)) return;
    DB.voidedRecords = DB.voidedRecords.filter(x => x.id !== voidId);
    saveData();
    toast('Purged', 'success');
    showPage('recycle');
}
function requestDelete(entityType, id){
    if (!can('deleteRecord')) { toast('Admin only.', 'error'); return; }
    const reg = ENTITIES[entityType];
    if (!reg) return;
    const record = DB[reg.key].find(x => x.id === id);
    if (!record) { toast('Not found', 'error'); return; }
    const label = record[reg.nameField] || id;
    const blockers = getDeleteBlockers(entityType, id);
    let bodyHTML = `
        <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-bottom:16px">
            <div style="font-weight:bold;color:#b91c1c;margin-bottom:6px">⚠ About to void:</div>
            <div style="font-size:14px"><b>${esc(reg.label)}:</b> ${esc(label)}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:4px">ID: ${esc(id)}</div>
        </div>`;
    if (blockers.length > 0) {
        bodyHTML += `<div class="dep-warning">
            <div style="font-weight:bold;margin-bottom:6px">🚫 Cannot delete — dependencies found:</div>
            <div class="dep-list">${blockers.map(b => `<div><b>${esc(b.type)}</b> (${b.count}) — ${b.preview.map(esc).join(', ')}${b.count > b.preview.length ? '…' : ''}</div>`).join('')}</div>
        </div>`;
        openModal('Delete Blocked', bodyHTML, `<button class="btn-light" onclick="closeModal()">Close</button>`);
        return;
    }
    bodyHTML += `
        <div class="form-row"><label>Reason (optional)</label><textarea id="deleteReason"></textarea></div>
        <p style="font-size:12px;color:#6b7280">Soft delete. Restorable from Recycle Bin.</p>`;
    openModal('Confirm Deletion', bodyHTML, `
        <button class="btn-light" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete('${entityType}','${id}')">Yes, Void It</button>`);
}
function confirmDelete(entityType, id){
    const reason = (document.getElementById('deleteReason')?.value || '').trim();
    const ok = softDelete(entityType, id, reason);
    closeModal();
    if (ok) { toast('Deleted', 'success'); showPage(currentPageKey()); }
}
function currentPageKey(){
    const el = document.querySelector('.menu-item.active');
    return el ? el.dataset.page : 'dashboard';
}

/* ---------- SCOPE ---------- */
function getMyStores(user){
    const u = user || currentUser();
    if (!u) return [];
    if (u.role === 'admin') return DB.stores.filter(s => s.status==='Active').map(s => s.id);
    if (u.role === 'store') return u.storeId && getStore(u.storeId) ? [u.storeId] : [];
    if (u.role === 'opmanager') return DB.stores.filter(s => s.status==='Active' && norm(s.operationManagerName)===norm(u.name)).map(s=>s.id);
    if (u.role === 'area') return DB.stores.filter(s => s.status==='Active' && norm(s.areaManagerName)===norm(u.name)).map(s=>s.id);

/* ---------- SESSION ---------- */
function currentUser(){
    // Cloud mode: use the cached logged-in profile
    if (CLOUD_MODE === 'supabase') {
        return window._cloudMe || null;
    }
    // Local mode: read from sessionStorage
    try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        return DB.users.find(u => u.username === s.username) || null;
    } catch(e) { return null; }
}
function setSession(u){ sessionStorage.setItem(SESSION_KEY, JSON.stringify({ username:u })); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
function can(action){ const u = currentUser(); return u && ACTIONS[action] && ACTIONS[action].includes(u.role); }
function canPage(page){ const u = currentUser(); return u && PERMISSIONS[u.role] && PERMISSIONS[u.role].includes(page); }
function isAdmin(){ const u = currentUser(); return u && u.role==='admin'; }

function canApproveForStore(storeId, user){
    const u = user || currentUser();
    if (!u) return false;
    if (u.role === 'admin') return true;
    if (u.role !== 'area') return false;
    const store = getStore(storeId);
    if (!store) return false;
    return norm(store.areaManagerName) === norm(u.name);
}
function pendingTransfersForMe(user){
    const u = user || currentUser();
    if (!u) return [];
    return DB.transfers.filter(t => t.status === 'Pending' && canApproveForStore(t.fromStoreId, u));
}

/* ---------- MONTH / WEEK UTILS ---------- */
function monthIndexFromTag(tag){
    if (!tag) return -1;
    const parts = tag.split(' ');
    const m = MONTHS.indexOf(parts[0]);
    const y = parseInt(parts[1], 10);
    if (m < 0 || isNaN(y)) return -1;
    return y * 12 + m;
}
function monthTagFromIndex(idx){ return `${MONTHS[idx % 12]} ${Math.floor(idx/12)}`; }
function monthTagFromISO(iso){
    const [y,m,d] = iso.split('-').map(x=>parseInt(x,10));
    if (isNaN(y) || isNaN(m)) return '';
    return `${MONTHS[m-1]} ${y}`;
}
function nextMonthTag(tag){ const idx = monthIndexFromTag(tag); return idx < 0 ? '' : monthTagFromIndex(idx + 1); }
function getCurrentMonthTag(){ const d = new Date(); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function monthStartISO(tag){ const idx = monthIndexFromTag(tag), y = Math.floor(idx/12), m = idx%12; return new Date(y, m, 1).toISOString(); }
function monthEndISO(tag){ const idx = monthIndexFromTag(tag), y = Math.floor(idx/12), m = idx%12; return new Date(y, m+1, 0, 23, 59, 59).toISOString(); }
function isMonthClosed(storeId, monthTag){ return DB.closedMonths.some(c => c.storeId===storeId && c.month===monthTag); }
function getAvailableMonths(){ const now = new Date(); const list = []; for (let i = -2; i <= 2; i++) { const d = new Date(now.getFullYear(), now.getMonth()+i, 1); list.push(`${MONTHS[d.getMonth()]} ${d.getFullYear()}`); } return list; }
function getISOWeek(d){
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}
function weekTagFromISO(iso){
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return '';
    return `Week ${getISOWeek(d)} - ${d.getFullYear()}`;
}

/* ---------- MOVEMENT ENGINE ---------- */
function getLastJournalForStore(storeId, beforeISO){
    let list = DB.journals.filter(j => j.storeId === storeId && j.status === 'Submitted');
    if (beforeISO) list = list.filter(j => j.createdAt < beforeISO);
    list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    return list[0] || null;
}
function getMonthOpening(storeId, itemId, monthTag){
    const op = DB.openingStock.filter(o => o.storeId===storeId && o.month===monthTag && o.status==='Posted').sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    if (!op) return null;
    return op.lines.find(l => l.itemId === itemId) || null;
}
function sumPurchasesInRange(storeId, itemId, startISO, endISO){
    let sum = 0;
    DB.purchases.forEach(p => {
        if (p.storeId !== storeId) return;
        if (p.date < startISO) return;
        if (endISO && p.date > endISO) return;
        p.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumPurchasesSince(storeId, itemId, sinceISO){
    let sum = 0;
    DB.purchases.forEach(p => {
        if (p.storeId !== storeId) return;
        if (p.createdAt < sinceISO) return;
        p.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersOutInRange(storeId, itemId, startISO, endISO){
    let sum = 0;
    DB.transfers.forEach(t => {
        if (t.fromStoreId !== storeId || t.status !== 'Approved' || !t.approvedAt) return;
        const d = t.approvedAt.slice(0,10);
        if (d < startISO) return;
        if (endISO && d > endISO) return;
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersInInRange(storeId, itemId, startISO, endISO){
    let sum = 0;
    DB.transfers.forEach(t => {
        if (t.toStoreId !== storeId || t.status !== 'Approved' || !t.approvedAt) return;
        const d = t.approvedAt.slice(0,10);
        if (d < startISO) return;
        if (endISO && d > endISO) return;
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersOutSince(storeId, itemId, sinceISO){
    let sum = 0;
    DB.transfers.forEach(t => {
        if (t.fromStoreId !== storeId || t.status !== 'Approved' || !t.approvedAt) return;
        if (t.approvedAt < sinceISO) return;
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumTransfersInSince(storeId, itemId, sinceISO){
    let sum = 0;
    DB.transfers.forEach(t => {
        if (t.toStoreId !== storeId || t.status !== 'Approved' || !t.approvedAt) return;
        if (t.approvedAt < sinceISO) return;
        t.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function ledgerMatchesJournal(c, journal){
    if (!c || c.storeId !== journal.storeId) return false;
    const type = c.inventoryType || 'daily';
    if (type !== journal.type) return false;
    if (type === 'daily') return c.date === journal.date;
    if (type === 'weekly') return (c.week || '') === (journal.week || '');
    if (type === 'closing') return (c.month || '') === (journal.month || '');
    return false;
}
function sumConsumptionTagged(storeId, itemId, journal){
    let sum = 0;
    DB.consumptionLedger.forEach(c => {
        if (!ledgerMatchesJournal(c, journal)) return;
        c.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function sumMTDConsumption(storeId, itemId, journal){
    const monthStart = monthStartISO(journal.month).slice(0,10);
    const monthEnd = monthEndISO(journal.month).slice(0,10);
    let sum = 0;
    DB.consumptionLedger.forEach(c => {
        if (c.storeId !== storeId) return;
        const d = c.date || '';
        if (d < monthStart || d > monthEnd) return;
        c.lines.forEach(l => { if (l.itemId === itemId) sum += Number(l.qty)||0; });
    });
    return sum;
}
function buildCountLines(journal){
    const storeId = journal.storeId;
    const type = journal.type;
    const monthTag = journal.month;
    const monthStart = monthStartISO(monthTag).slice(0,10);
    const monthEnd = monthEndISO(monthTag).slice(0,10);
    const items = DB.items.filter(it => {
        if (it.status !== 'Active') return false;
        if (type === 'daily') return it.daily;
        if (type === 'weekly') return it.weekly;
        if (type === 'closing') return it.monthly;
        return false;
    });
    let openingSource = { source:'month-opening', journal:null };
    let purchaseFn, tInFn, tOutFn, consFn;
    if (type === 'daily' || type === 'weekly') {
        const lastJ = getLastJournalForStore(storeId, journal.createdAt || nowISO());
        if (lastJ) {
            openingSource = { source:'previous-journal', journal: lastJ };
            purchaseFn = (id) => sumPurchasesSince(storeId, id, lastJ.createdAt);
            tInFn      = (id) => sumTransfersInSince(storeId, id, lastJ.createdAt);
            tOutFn     = (id) => sumTransfersOutSince(storeId, id, lastJ.createdAt);
        } else {
            purchaseFn = (id) => sumPurchasesInRange(storeId, id, monthStart, journal.date);
            tInFn      = (id) => sumTransfersInInRange(storeId, id, monthStart, journal.date);
            tOutFn     = (id) => sumTransfersOutInRange(storeId, id, monthStart, journal.date);
        }
        consFn = (id) => sumConsumptionTagged(storeId, id, journal);
    } else {
        purchaseFn = (id) => sumPurchasesInRange(storeId, id, monthStart, monthEnd);
        tInFn      = (id) => sumTransfersInInRange(storeId, id, monthStart, monthEnd);
        tOutFn     = (id) => sumTransfersOutInRange(storeId, id, monthStart, monthEnd);
        consFn     = (id) => sumMTDConsumption(storeId, id, journal);
    }
    return {
        lines: items.map(it => {
            let opening;
            if (type === 'daily' && openingSource.source === 'previous-journal') {
                const line = openingSource.journal.lines.find(l => l.itemId === it.id);
                opening = line ? Number(line.physical) || 0 : 0;
            } else {
                const op = getMonthOpening(storeId, it.id, monthTag);
                opening = op ? Number(op.qty) || 0 : 0;
            }
            const purchases = purchaseFn(it.id);
            const tIn = tInFn(it.id);
            const tOut = tOutFn(it.id);
            const consumption = consFn(it.id);
            const expected = opening + purchases + tIn - tOut - consumption;
            const mtdPurch = sumPurchasesInRange(storeId, it.id, monthStart, journal.date);
            const mtdTIn   = sumTransfersInInRange(storeId, it.id, monthStart, journal.date);
            const mtdTOut  = sumTransfersOutInRange(storeId, it.id, monthStart, journal.date);
            const mtdCons  = sumMTDConsumption(storeId, it.id, journal);
            return {
                itemId: it.id, uom: it.uom,
                opening, purchases, transfersIn: tIn, transfersOut: tOut, consumption, expected,
                physical: 0, variance: 0,
                mtdPurchases: mtdPurch, mtdTransfersIn: mtdTIn, mtdTransfersOut: mtdTOut,
                mtdConsumption: mtdCons
            };
        }),
        openingSource
    };
}
function rollMonthForward(storeId, monthTag, closingJournal){
    const nextMonth = nextMonthTag(monthTag);
    if (!nextMonth) return null;
    const existing = DB.openingStock.find(o => o.storeId===storeId && o.month===nextMonth && o.status==='Posted');
    if (existing) { toast(`Opening for ${nextMonth} already exists`, 'error'); return null; }
    const lines = closingJournal.lines.map(l => ({ itemId: l.itemId, qty: Number(l.physical)||0, uom: l.uom }));
    const u = currentUser();
    const date = todayISO();
    const id = nextMovementId('OPN', DB.openingStock, date);
    const newOpening = { id, storeId, month: nextMonth, date, byId: u.id, byName: u.name, status:'Posted', lines, createdAt: nowISO(), rolledFrom: closingJournal.id };
    DB.openingStock.push(newOpening);
    if (!isMonthClosed(storeId, monthTag)) {
        DB.closedMonths.push({ storeId, month: monthTag, closedAt: nowISO(), closedById: u.id, closedByName: u.name, closingId: closingJournal.id, rolledToOpeningId: newOpening.id });
    }
    return newOpening;
}

function renderEmployeesTable(rows){

function filterEmployees(){

    const r = document.getElementById('empRoleFilter').value;

    if (q) rows = rows.filter(e => (e.code+e.name).toLowerCase().includes(q));
    if (r) rows = rows.filter(e => e.role === r);
    document.getElementById('employeesTableBody').innerHTML = renderEmployeesTable(rows);
    document.getElementById('empCount').textContent = rows.length + ' Employees';
}
function openEmployeeModal(editId){
    const editing = editId ? getEmployee(editId) : null;
    const title = editing ? 'Edit Employee' : 'Add Employee';
    const code = editing ? editing.code : '';
    const name = editing ? editing.name : '';
    const role = editing ? editing.role : '';
    openModal(title, `
        <div class="form-row"><label>Employee Code</label>
            <input id="eCode" value="${esc(code)}" placeholder="e.g. EMP-0001 or 1001"></div>
        <div class="form-row"><label>Employee Name</label>
            <input id="eName" value="${esc(name)}" placeholder="e.g. Faisal Al-Harbi"></div>
        <div class="form-row"><label>Role</label>
            <select id="eRole">
                <option value="">— Select Role —</option>
                ${EMPLOYEE_ROLES.map(r => `<option value="${r}" ${r===role?'selected':''}>${esc(r)}</option>`).join('')}
            </select>
        </div>
    `, `
        <button class="btn-light" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveEmployee('${editId||''}')">${editing?'Save Changes':'Add Employee'}</button>
    `);
}
function saveEmployee(editId){
    const code = document.getElementById('eCode').value.trim();
    const name = document.getElementById('eName').value.trim();
    const role = document.getElementById('eRole').value;
    if (!code || !name || !role) { toast('Code, Name, and Role required', 'error'); return; }
    const dupCode = DB.employees.find(e => norm(e.code) === norm(code) && e.id !== editId);
    if (dupCode) { toast('Employee code already exists', 'error'); return; }
    const dupName = DB.employees.find(e => norm(e.name) === norm(name) && e.id !== editId);
    if (dupName) { toast('Employee name already exists', 'error'); return; }
    if (editId) {
        const e = getEmployee(editId);
        if (!e) { toast('Not found', 'error'); return; }
        const oldName = e.name;
        e.code = code; e.name = name; e.role = role;
        if (oldName !== name) {
            DB.stores.forEach(s => {
                if (norm(s.storeManagerName) === norm(oldName)) s.storeManagerName = name;
                if (norm(s.areaManagerName) === norm(oldName)) s.areaManagerName = name;
                if (norm(s.operationManagerName) === norm(oldName)) s.operationManagerName = name;
            });
        }
        audit('UPDATE','employee',e.id,{ code, name, role });
        saveData(); closeModal(); toast('Employee updated', 'success');
    } else {
        const rec = { id: uid('emp'), code, name, role, status:'Active', createdAt: nowISO() };
        DB.employees.push(rec);
        audit('CREATE','employee',rec.id,{ code, name, role });
        saveData(); closeModal(); toast(`Employee "${name}" added`, 'success');
    }
    showPage('employees');
}

    const storeManagerName = document.getElementById('mSStoreMgr').value;

    if (!code || !name) { toast('Code and Name required', 'error'); return; }
    const dup = DB.stores.find(s => norm(s.code) === norm(code) && s.id !== editId);
    if (dup) { toast('Store code exists', 'error'); return; }
    if (editId) {
        const s = getStore(editId);
        if (!s) { toast('Not found', 'error'); return; }
        s.code = code; s.name = name; s.area = area; s.type = type;
        s.storeManagerName = storeManagerName;
        s.areaManagerName = areaManagerName;
        s.operationManagerName = operationManagerName;
        audit('UPDATE','store',s.id,{ code, name });

            storeManagerName, areaManagerName, operationManagerName,
            status:'Active', createdAt: nowISO()
        });
        audit('CREATE','store',id,{ code, name });
        saveData(); closeModal(); toast('Store added', 'success');

function onUserRoleChange(){

    if (role === 'area') { infoBlock.style.display = 'block'; infoText.innerHTML = `Will see stores where Area Manager = "<b>${esc(name)}</b>". Approves stock transfers for those stores.`; }
    else if (role === 'opmanager') { infoBlock.style.display = 'block'; infoText.innerHTML = `Will see stores where Op Manager = "<b>${esc(name)}</b>".`; }
    else if (role === 'admin' || role === 'wh' || role === 'viewer') { infoBlock.style.display = 'block'; infoText.innerHTML = `Will see <b>all stores</b>${role==='admin'?'. Admin can approve anything.':''}`; }
}
async function saveUser(editId){
    const username = document.getElementById('uUsername').value.trim().toLowerCase();
    const password = document.getElementById('uPassword').value;
    const name = document.getElementById('uName').value.trim();
    const initials = (document.getElementById('uInitials').value.trim() || name.split(' ').map(x=>x[0]).join('').slice(0,2)).toUpperCase();
    const role = document.getElementById('uRole').value;
    if (!username || !name || !role) { toast('Username, Name, and Role required', 'error'); return; }
    if (!editId && !password) { toast('Password required', 'error'); return; }
    const dup = DB.users.find(u => u.username === username && u.id !== editId);
    if (dup) { toast('Username exists', 'error'); return; }
    if (editId) {
        const u = DB.users.find(x => x.id === editId);
        if (!u) { toast('Not found', 'error'); return; }
        if (u.username === 'admin' && (username !== 'admin' || role !== 'admin')) {
            toast('Cannot change admin username or role', 'error'); return;
        }
        u.username = username;
        if (password) u.pass = password;
        u.name = name;
        u.initials = initials;
        u.role = role;
        if (role === 'store') {
            const sid = document.getElementById('uStore').value;
            u.storeId = sid || null;
        } else { delete u.storeId; }
        audit('UPDATE','user',u.id,{ username, role });
        saveData(); closeModal(); toast('User updated', 'success');
        if (u.id === currentUser()?.id) {
            document.getElementById('userName').textContent = u.name;
            document.getElementById('userRole').textContent = ROLE_LABEL[u.role] || u.role;
            document.getElementById('userAvatar').textContent = u.initials || '??';
        }
    } else {
        const email = username.includes('@') ? username : (username + '@drcafe.com');

        if (role === 'store') {
            const sid = document.getElementById('uStore').value;
            if (!sid) { toast('Select a store', 'error'); return; }
        }

        if (CLOUD_MODE === 'supabase') {
            // Call the Edge Function to create the auth user
            const { data, error } = await SB.functions.invoke('create-user', {
                body: {
                    email,
                    password,
                    name,
                    initials,
                    role,
                    storeId: (role === 'store') ? document.getElementById('uStore').value : null
                }
            });
            if (error) { toast('Create failed: ' + (error.message || error), 'error'); return; }
            audit('CREATE','user',data.id || email,{ email, role });
            closeModal();
            toast(`User created. Email: ${email} — Password: ${password}`, 'success');
            DB = await loadData();
            showPage('users');
            return;
        }

        // Local mode fallback
        const newUser = { id: uid('u'), username: email, pass: password, name, initials, role, active:true, createdAt:nowISO() };

}

function saveItem(editId){
    const code = document.getElementById('mICode').value.trim();
    const name = document.getElementById('mIName').value.trim();
    if (!code || !name) { toast('Code and Name required', 'error'); return; }
    if (DB.items.find(i => i.code===code && i.id !== editId)) { toast('Code exists', 'error'); return; }
    if (editId) {
        const i = getItem(editId);
        if (!i) { toast('Not found', 'error'); return; }
        i.code = code; i.name = name;
        i.cat = document.getElementById('mICat').value;
        i.uom = document.getElementById('mIUOM').value || 'PCS';
        i.cost = Number(document.getElementById('mICost').value) || 0;
        i.daily = document.getElementById('mIDaily').checked;
        i.weekly = document.getElementById('mIWeekly').checked;
        i.monthly = document.getElementById('mIMonthly').checked;
        audit('UPDATE','item',i.id,{ code, name });
        saveData(); closeModal(); toast('Item updated', 'success');
    } else {
        const id = 'i-' + code.toLowerCase().replace(/[^a-z0-9]/g,'');
        if (getItem(id)) { toast('ID collision', 'error'); return; }
        DB.items.push({
            id, code, name,
            cat: document.getElementById('mICat').value,
            uom: document.getElementById('mIUOM').value || 'PCS',

            monthly: document.getElementById('mIMonthly').checked,
            status:'Active', createdAt: nowISO()
        });

        saveData(); closeModal(); toast('Item added', 'success');
    }
    showPage('items');
}

    `, `

function addBOMLine(){ window._workingBOMLines.push({ itemId:'', itemCode:'', itemName:'', qty:0, uom:'' }); renderBOMLines(); }
function removeBOMLine(idx){ window._workingBOMLines.splice(idx, 1); renderBOMLines(); }
function renderBOMLines(){
    const lines = window._workingBOMLines;
    const tbody = document.getElementById('bomLines');
    if (!tbody) return;
    if (lines.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#9ca3af;padding:20px">No ingredients yet</td></tr>';
        return;
    }
    const activeItems = DB.items.filter(i => i.status === 'Active');
    tbody.innerHTML = lines.map((l, idx) => `
        <tr>
            <td>
                <select onchange="updateBOMLine(${idx},'itemId',this.value)">
                    <option value="">— Select item —</option>
                    ${activeItems.map(i => `<option value="${i.id}" ${i.id===l.itemId?'selected':''}>${esc(i.code)} — ${esc(i.name)}</option>`).join('')}
                </select>
            </td>
            <td><input type="number" step="0.001" min="0" value="${l.qty}" oninput="updateBOMLine(${idx},'qty',this.value)"></td>
            <td><input value="${esc(l.uom)}" readonly style="background:#f9fafb"></td>
            <td><button type="button" class="btn-danger btn-xs" onclick="removeBOMLine(${idx})">✕</button></td>
        </tr>
    `).join('');
}
function updateBOMLine(idx, field, value){
    const l = window._workingBOMLines[idx];
    if (!l) return;
    if (field === 'qty') l.qty = Number(value) || 0;
    else if (field === 'itemId') {
        const it = getItem(value);
        l.itemId = value; l.itemCode = it ? it.code : ''; l.itemName = it ? it.name : ''; l.uom = it ? it.uom : '';
        renderBOMLines();
    }
}
function saveBOM(editId){
    const productId = document.getElementById('mBProductId').value.trim();
    const productName = document.getElementById('mBProductName').value.trim();
    const cat = document.getElementById('mBCat').value;
    const version = Number(document.getElementById('mBVer').value) || 1;
    const effective = document.getElementById('mBEff').value;
    const lines = window._workingBOMLines.filter(l => l.itemId && l.qty > 0);
    if (!productId) { toast('Product ID is required', 'error'); return; }
    if (!productName) { toast('Product Name is required', 'error'); return; }
    if (lines.length === 0) { toast('Add at least one ingredient with qty > 0', 'error'); return; }
    const dup = DB.bom.find(b => norm(b.productId) === norm(productId) && b.id !== editId);
    if (dup) { toast(`Product ID "${productId}" already used by BOM ${dup.id}`, 'error'); return; }
    const seen = new Set();
    for (const l of lines) {
        if (seen.has(l.itemId)) { toast(`Duplicate ingredient: ${l.itemCode}`, 'error'); return; }
        seen.add(l.itemId);
    }
    if (editId) {
        const b = DB.bom.find(x => x.id === editId);
        if (!b) { toast('Not found', 'error'); return; }
        b.productName = productName; b.cat = cat; b.version = version; b.effective = effective;
        b.lines = lines.map(l => ({ itemId: l.itemId, itemCode: l.itemCode, itemName: l.itemName, qty: l.qty, uom: l.uom }));
        audit('UPDATE','bom',b.id,{ productId, productName });
        saveData(); closeModal(); toast('BOM updated', 'success');
    } else {
        const id = 'BOM-' + String(DB.bom.length + 1).padStart(5, '0');
        DB.bom.push({
            id, productId, productName, cat, version, effective, status:'Active',
            lines: lines.map(l => ({ itemId: l.itemId, itemCode: l.itemCode, itemName: l.itemName, qty: l.qty, uom: l.uom }))
        });
        audit('CREATE','bom',id,{ productId, productName });
        saveData(); closeModal(); toast('BOM created', 'success');
    }
    showPage('bom');
}

function saveTransfer(editId){
    const t = window._workingTransfer;
    t.date = document.getElementById('tDate').value;
    t.notes = document.getElementById('tNotes').value.trim();
    t.reference = document.getElementById('tRef').value.trim();
    if (!t.date) { toast('Date required', 'error'); return; }
    if (!t.fromStoreId || !t.toStoreId) { toast('From and To stores required', 'error'); return; }
    if (t.fromStoreId === t.toStoreId) { toast('From and To must be different', 'error'); return; }
    const valid = t.lines.filter(l => l.itemId && l.qty > 0);
    if (valid.length === 0) { toast('Add at least one item with qty > 0', 'error'); return; }
    const u = currentUser();

        rec.fromStoreId = t.fromStoreId; rec.toStoreId = t.toStoreId;
        rec.lines = valid.map(l => ({ itemId: l.itemId, qty: l.qty, uom: l.uom }));

        saveData(); closeModal(); toast('Transfer updated', 'success');

            toStoreId: t.toStoreId,
            reference: t.reference,
            notes: t.notes,
            lines: valid.map(l => ({ itemId: l.itemId, qty: l.qty, uom: l.uom })),
            status: 'Pending',
            byId: u.id, byName: u.name,
            createdAt: nowISO(),
            approvedAt: null, approvedById: null, approvedByName: null,
            rejectedAt: null, rejectedById: null, rejectedByName: null
        });

}
async function approveTransfer(id){
    const u = currentUser();
    const t = DB.transfers.find(x => x.id === id);
    if (!t) { toast('Not found', 'error'); return; }
    if (t.status !== 'Pending') { toast('Only pending transfers can be approved', 'error'); return; }
    if (!canApproveForStore(t.fromStoreId, u)) { toast('Only the assigned Area Manager can approve.', 'error'); return; }
    if (!confirm(`Approve transfer ${t.id}?\n\nSource: ${storeLabel(t.fromStoreId)}\n\nDestination: ${storeLabel(t.toStoreId)}\n\nApproval will move inventory immediately.`)) return;

    try {
        if (CLOUD_MODE === 'supabase') {
            await DataLayer.approveTransfer(id, u);
        }
        t.status = 'Approved';
        t.approvedAt = nowISO();
        t.approvedById = u.id;
        t.approvedByName = u.name;
        audit('APPROVE','transfer',id,{ });
        saveData();
        toast(`Transfer ${id} approved — inventory updated`, 'success');
        showPage('transfers');
    } catch(err) {
        toast('Approve failed: ' + (err.message || err), 'error');
    }
}
function rejectTransfer(id){
    const u = currentUser();
    const t = DB.transfers.find(x => x.id === id);
    if (!t) return;
    if (t.status !== 'Pending') { toast('Only pending transfers can be rejected', 'error'); return; }
    if (!canApproveForStore(t.fromStoreId, u)) { toast('Only the assigned Area Manager can reject.', 'error'); return; }

    toast(`Transfer ${id} rejected`, 'error');
    showPage('transfers');
}

function handleSalesUpload(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!XLSX_READY) { toast('Excel library loading', 'error'); evt.target.value=''; return; }
    if (!can('uploadSales')) { toast('Access denied', 'error'); return; }
    const batchDate = (document.getElementById('salesBatchDate')?.value) || todayISO();
    const inventoryType = document.getElementById('salesInvType')?.value || 'daily';
    const week = inventoryType === 'weekly' ? weekTagFromISO(batchDate) : null;
    const monthTag = monthTagFromISO(batchDate);
    const reader = new FileReader();
    reader.onload = function(e){
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type:'array', cellDates: true });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, { defval:'', raw: true });
            processSalesRows(json, file.name, { batchDate, inventoryType, week, monthTag });
        } catch(err) { toast('Parse failed: ' + err.message, 'error'); }
    };
    reader.readAsArrayBuffer(file);
    evt.target.value = '';
}
function processSalesRows(rows, filename, tag){
    const u = currentUser();
    const myStoreIds = new Set(getMyStores(u));
    if (rows.length === 0) { toast('File is empty', 'error'); return; }
    const H = {
        storeCode: ['store code','store','storecode','store_code','branch','branch code'],
        productId: ['product id','product code','productid','productcode','sku','item code','item'],
        qty:       ['qty','qty sold','quantity','sold','sales','units','units sold','sale qty'],
        date:      ['date','sale date','sales date','transaction date','txn date','day']
    };
    function pick(obj, keys){
        for (const k of Object.keys(obj)) if (keys.includes(k.toLowerCase().trim())) return obj[k];
        return '';
    }
    const parsed = []; const rejects = [];
    rows.forEach((row, i) => {
        const lineNo = i + 2;
        const storeCode = String(pick(row, H.storeCode) || '').trim();
        const productId = String(pick(row, H.productId) || '').trim();
        const qtyRaw    = pick(row, H.qty);
        if (!storeCode && !productId && qtyRaw === '') return;
        if (!storeCode) { rejects.push(`Row ${lineNo}: missing Store Code`); return; }
        if (!productId) { rejects.push(`Row ${lineNo}: missing Product ID`); return; }
        const store = getStoreByCode(storeCode);
        if (!store) { rejects.push(`Row ${lineNo}: Store "${storeCode}" not found`); return; }
        if (!myStoreIds.has(store.id)) { rejects.push(`Row ${lineNo}: Store "${storeCode}" is out of your scope`); return; }
        const bom = getBOMByProductId(productId);
        if (!bom) { rejects.push(`Row ${lineNo}: No BOM found for Product ID "${productId}"`); return; }
        const qty = Number(qtyRaw);
        if (isNaN(qty) || qty <= 0) { rejects.push(`Row ${lineNo}: invalid Qty "${qtyRaw}"`); return; }
        parsed.push({ lineNo, storeId: store.id, storeCode, productId: bom.productId, bomId: bom.id, qty });
    });
    if (parsed.length === 0) { toast('No valid rows to import', 'error'); if (rejects.length > 0) showRejectReport(rejects, filename); return; }
    const closedBlockers = [];
    const seenKeys = new Set();
    if (tag.inventoryType !== 'closing') {
        parsed.forEach(p => {
            const key = p.storeId + '|' + tag.monthTag;
            if (seenKeys.has(key)) return;
            seenKeys.add(key);
            if (isMonthClosed(p.storeId, tag.monthTag)) {
                const store = getStore(p.storeId);
                const count = parsed.filter(x => x.storeId === p.storeId).length;
                closedBlockers.push({ storeCode: store ? store.code : p.storeId, month: tag.monthTag, rowsAffected: count });
            }
        });
    }
    if (closedBlockers.length > 0 && closedBlockers.length === seenKeys.size) {
        openModal('Upload Blocked — Month Closed', `
            <div class="dep-warning">
                <div style="font-weight:bold;margin-bottom:8px">🚫 Cannot upload. Target month is closed.</div>
                <div style="font-size:13px;line-height:1.7">
                    ${closedBlockers.map(b => `<div>• Store <b>${esc(b.storeCode)}</b> — <b>${esc(b.month)}</b> is closed (${b.rowsAffected} row(s))</div>`).join('')}
                </div>
            </div>
        `, `<button class="btn-light" onclick="closeModal()">Close</button>`);
        return;
    }
    let totalUnits = 0;
    const byStore = {};
    parsed.forEach(p => { (byStore[p.storeId] = byStore[p.storeId] || []).push(p); });
    Object.entries(byStore).forEach(([storeId, lines]) => {
        const uploadId = nextMovementId('SAL', DB.salesUploads, tag.batchDate);
        const consumed = {};
        lines.forEach(sl => {
            totalUnits += sl.qty;
            const bom = DB.bom.find(b => b.id === sl.bomId);
            if (!bom) return;
            bom.lines.forEach(l => {
                const totalQty = Number(l.qty) * sl.qty;
                if (!consumed[l.itemId]) consumed[l.itemId] = { itemId: l.itemId, uom: l.uom, qty: 0, breakdown: [] };
                consumed[l.itemId].qty += totalQty;
                consumed[l.itemId].breakdown.push({ productId: sl.productId, productName: bom.productName, soldQty: sl.qty, perUnit: Number(l.qty), exploded: totalQty });
            });
        });
        DB.salesUploads.push({
            id: uploadId, filename, date: tag.batchDate, batchDate: tag.batchDate,
            inventoryType: tag.inventoryType, week: tag.week || null, month: tag.monthTag,
            storeId,
            totalRows: rows.length, validRows: lines.length, rejectedRows: rejects.length,
            unitsSold: lines.reduce((s,x) => s + x.qty, 0),
            lines: lines.map(sl => ({ productId: sl.productId, qty: sl.qty })),
            byId: u.id, byName: u.name, status:'Processed', createdAt: nowISO()
        });
        const ledgerLines = Object.values(consumed).map(c => ({
            itemId: c.itemId, qty: Number(c.qty.toFixed(4)), uom: c.uom, breakdown: c.breakdown
        }));
        DB.consumptionLedger.push({
            id: uploadId + '-LEDGER', storeId, date: tag.batchDate,
            uploadRef: uploadId, source: 'sales-bom',
            inventoryType: tag.inventoryType, week: tag.week || null, month: tag.monthTag,
            byId: u.id, byName: u.name, lines: ledgerLines, createdAt: nowISO()
        });
    });
    audit('UPLOAD','sales','',{ valid:parsed.length, rejects:rejects.length, totalUnits, tag:tag.inventoryType });
    saveData();
    const toastMsg = `Uploaded ${parsed.length} row(s), ${totalUnits} units — tagged ${tag.inventoryType}` + (rejects.length > 0 ? `, ${rejects.length} rejected` : '');
    if (rejects.length > 0) {
        openModal('Upload Completed with Rejections', `
            <p style="font-size:13px;color:#6b7280;margin-bottom:12px">File: <b>${esc(filename)}</b><br>Tagged: <b>${esc(tag.inventoryType)}</b></p>
            <div class="reject-list">${rejects.map(r => `<div>${esc(r)}</div>`).join('')}</div>
        `, `<button class="btn-primary" onclick="closeModal();showPage('sales')">OK</button>`);
        toast(toastMsg, 'success');
    } else { toast(toastMsg, 'success'); showPage('sales'); }
}
function showRejectReport(rejects, filename){
    openModal('Upload Completed with Rejections', `
        <p style="font-size:13px;color:#6b7280;margin-bottom:12px">File: <b>${esc(filename)}</b></p>
        <div class="reject-list">${rejects.map(r => `<div>${esc(r)}</div>`).join('')}</div>

function findDuplicateJournal(journal){
    return DB.journals.find(j => {
        if (j.status !== 'Submitted') return false;
        if (j.storeId !== journal.storeId) return false;
        if (j.type !== journal.type) return false;
        if (journal.type === 'daily') return j.date === journal.date;
        if (journal.type === 'weekly') return (j.week||'') === (journal.week||'');
        if (journal.type === 'closing') return (j.month||'') === (journal.month||'');
        return false;
    });
}

function startCount(type){
    const u = currentUser();
    const date = document.getElementById('setupDate').value;
    const storeId = document.getElementById('setupStore').value;
    if (!date || !storeId) { toast('Date and Store required', 'error'); return; }
    if (!isInScope(storeId, u)) { toast('Access denied.', 'error'); return; }
    const monthTag = monthTagFromISO(date);
    if (isMonthClosed(storeId, monthTag)) { toast(`${monthTag} is closed.`, 'error'); return; }
    const extra = {};
    if (type==='weekly') extra.week = document.getElementById('setupWeek').value;
    extra.month = monthTag;
    const prefix = { daily:'INV', weekly:'WKL', closing:'CLS' }[type];
    const journalNo = nextJournalNo(prefix, date);
    const header = { id: journalNo, type, date, storeId, ...extra, byId: u.id, byName: u.name, status:'Draft', createdAt: nowISO(), lines: [] };
    const dup = findDuplicateJournal(header);
    if (dup) {
        openModal('Duplicate Inventory', `
            <div class="dep-warning">
                <div style="font-weight:bold;margin-bottom:8px">🚫 Cannot create this inventory — one already exists</div>
                <div style="font-size:13px;line-height:1.8">

                    <div><b>Type:</b> ${esc(dup.type)}${dup.week?' · '+esc(dup.week):''}</div>
                </div>
            </div>
        `, `<button class="btn-light" onclick="closeModal()">Close</button>`);
        return;
    }
    const sales = findSalesUploadForJournal(header);
    if (!sales) { showNoSalesGate(header); return; }
    const result = buildCountLines(header);
    if (result.lines.length === 0) { toast(`No items flagged for ${type}`, 'error'); return; }

    header.baselineInfo = result.openingSource;
    window._workingCount = header;
    openCountSheet();
}

function countRowHTML(line, idx){
    const it = getItem(line.itemId);
    const v = line.physical - line.expected;
    const varClass = v === 0 ? 'var-ok' : Math.abs(v) > 1 ? 'var-bad' : 'var-warn';
    const status = line.physical === 0 ? '<span class="badge badge-gray">Not counted</span>'
                  : (Math.abs(v) > 1 ? '<span class="badge badge-red">Review</span>' : '<span class="badge badge-green">OK</span>');
    return `<tr data-idx="${idx}" data-code="${esc(it?it.code:'')}" data-name="${esc(it?it.name.toLowerCase():'')}">

        <td class="readonly-cell">${line.purchases>0?'+':''}${fmtNum(line.purchases)}</td>
        <td class="readonly-cell">${line.transfersIn>0?'+':''}${fmtNum(line.transfersIn||0)}</td>
        <td class="readonly-cell">${line.transfersOut>0?'−':''}${fmtNum(line.transfersOut||0)}</td>
        <td class="readonly-cell">−${fmtNum(line.consumption)}</td>
        <td class="readonly-cell bold">${fmtNum(line.expected)}</td>
        <td><input type="number" step="0.01" value="${line.physical}" oninput="updateCountLine(${idx}, this.value)"></td>
        <td class="var-cell ${varClass}" id="cVar${idx}">${v>0?'+':''}${fmtNum(v)}</td>
        <td id="cSts${idx}">${status}</td>
        <td class="readonly-cell mtd">${fmtNum(line.mtdPurchases||0)}</td>
        <td class="readonly-cell mtd">${fmtNum(line.mtdConsumption||0)}</td>
    </tr>`;
}
function updateCountLine(idx, value){
    const j = window._workingCount;
    if (!j) return;
    const line = j.lines[idx];
    line.physical = Number(value) || 0;
    line.variance = line.physical - line.expected;
    const v = line.variance;
    const varClass = v === 0 ? 'var-ok' : Math.abs(v) > 1 ? 'var-bad' : 'var-warn';
    const status = line.physical === 0 ? '<span class="badge badge-gray">Not counted</span>'
                  : (Math.abs(v) > 1 ? '<span class="badge badge-red">Review</span>' : '<span class="badge badge-green">OK</span>');
    document.getElementById('cVar'+idx).textContent = (v>0?'+':'') + fmtNum(v);
    document.getElementById('cVar'+idx).className = 'var-cell ' + varClass;
    document.getElementById('cSts'+idx).innerHTML = status;
    updateCountProgress();
}
function updateCountProgress(){
    const j = window._workingCount;
    if (!j) return;
    document.getElementById('cEntered').textContent = j.lines.filter(l => l.physical !== 0).length;
    const val = j.lines.reduce((s,l) => { const it = getItem(l.itemId); return s + ((l.variance||0) * (it?it.cost:0)); }, 0);
    const tv = document.getElementById('cTotalValue');

    if (!isInScope(storeId, u)) { toast('Access denied.', 'error'); return; }
    if (isMonthClosed(storeId, month)) { toast(`${month} is closed.`, 'error'); return; }
    const items = DB.items.filter(i => i.status==='Active');
    const journalNo = nextMovementId('OPN', DB.openingStock, date);
    window._workingOpening = { id: journalNo, storeId, month, date, byId: u.id, byName: u.name, status:'Draft', lines: items.map(it => ({ itemId: it.id, qty: 0, uom: it.uom })) };
    openOpeningSheet();
}
function openOpeningSheet(){
    const o = window._workingOpening;
    const modalBox = document.getElementById('modalBox');
    modalBox.className = 'modal modal-xl';
    document.getElementById('modalTitle').innerHTML = `Opening <span style="color:#2563eb">${esc(o.id)}</span>`;
    document.getElementById('modalBody').innerHTML = `
        <div class="journal-meta">
            <div><div class="k">Month</div><div class="v">${esc(o.month)}</div></div>
            <div><div class="k">Store</div><div class="v">${esc(storeLabel(o.storeId))}</div></div>
            <div><div class="k">Date</div><div class="v">${esc(o.date)}</div></div>
            <div><div class="k">Items</div><div class="v">${o.lines.length}</div></div>
        </div>
        <div class="journal-table-wrap"><table><thead><tr>
            <th>Code</th><th>Item</th><th>UOM</th><th>Qty</th><th>Cost</th><th>Value</th>
        </tr></thead><tbody id="openingBody">${o.lines.map((l, idx) => {
            const item = getItem(l.itemId), cost = item ? item.cost : 0;
            return `<tr data-idx="${idx}">
                <td>${esc(item?item.code:'?')}</td><td>${esc(item?item.name:'Unknown')}</td><td>${esc(l.uom)}</td>
                <td><input type="number" step="0.01" value="${l.qty}" oninput="updateOpeningLine(${idx},this.value)"></td>
                <td class="readonly-cell">${fmtNum(cost)}</td>
                <td class="readonly-cell" id="opVal${idx}">${fmtNum(l.qty*cost)}</td></tr>`;
        }).join('')}</tbody></table></div>
    `;

        <div style="flex:1;font-size:12px;color:#6b7280;align-self:center">Total: <b id="opTotalValue" style="color:#2563eb">SAR 0.00</b></div>
        <button class="btn-light" onclick="closeModal()">Cancel</button>
        <button class="btn-success" onclick="submitOpening()">Post</button>`;
    document.getElementById('modalOverlay').classList.add('show');
    updateOpeningProgress();
}
function updateOpeningLine(idx, value){
    const o = window._workingOpening;
    o.lines[idx].qty = Number(value) || 0;
    const item = getItem(o.lines[idx].itemId);
    document.getElementById('opVal'+idx).textContent = fmtNum(o.lines[idx].qty * (item ? item.cost : 0));
    updateOpeningProgress();
}
function updateOpeningProgress(){
    const o = window._workingOpening;
    const total = o.lines.reduce((s,l) => s + (l.qty * (getItem(l.itemId)?.cost || 0)), 0);
    document.getElementById('opTotalValue').textContent = 'SAR ' + fmtNum(total);
}
function submitOpening(){
    const o = window._workingOpening;
    if (!o.lines.some(l => l.qty !== 0)) { toast('Enter at least one qty', 'error'); return; }
    o.status = 'Posted'; o.createdAt = nowISO();
    DB.openingStock.push(o);
    saveData(); window._workingOpening = null; closeModal();
    toast(`Opening ${o.id} posted`, 'success'); showPage('opening');
}
function viewOpening(id){

RENDERERS.purchases = function(){
    const u = currentUser();
    const canCreate = can('createPurchase');
    const myStoreIds = new Set(getMyStores(u));
    const myStores = DB.stores.filter(s => myStoreIds.has(s.id));
    let rows = DB.purchases.filter(p => myStoreIds.has(p.storeId)).slice().reverse();
    return `
    <div class="scope-banner"><b>Scope:</b> ${esc(scopeLabel(u))}</div>
    <div class="toolbar">
        <select id="purchStoreFilter" onchange="filterPurchases()">
            <option value="">All Stores</option>
            ${myStores.map(s => `<option value="${s.id}">${s.code} — ${esc(s.name)}</option>`).join('')}
        </select>
        ${canCreate && myStores.length > 0 ? `<button class="btn-primary" onclick="openPurchaseModal()">+ New Purchase</button>` : ''}
    </div>
    <div class="panel">
        <div class="panel-header"><div class="panel-title">Purchases</div>
        <span class="badge badge-blue">${rows.length}</span></div>
        <div class="panel-body" id="purchListBody">${renderPurchasesTable(rows)}</div>
    </div>`;
};
function renderPurchasesTable(rows){
    if (rows.length === 0) return '<div class="empty">No purchases yet</div>';
    return `<table><thead><tr><th>ID</th><th>Date</th><th>Store</th><th>Supplier</th><th>Total</th><th>Actions</th></tr></thead>
        <tbody>${rows.map(p => {
            const t = p.lines.reduce((s,l) => s + (l.qty * (l.cost||0)), 0);
            return `<tr>
                <td><b>${esc(p.id)}</b></td><td>${esc(p.date)}</td>
                <td>${esc(storeLabel(p.storeId))}</td><td>${esc(p.supplier||'—')}</td>
                <td>SAR ${fmtNum(t)}</td>
                <td class="actions-cell">${deleteBtn('purchase', p.id)}</td></tr>`;
        }).join('')}</tbody></table>`;
}
function filterPurchases(){
    const sf = document.getElementById('purchStoreFilter').value;
    const myStoreIds = new Set(getMyStores());
    let rows = DB.purchases.filter(p => myStoreIds.has(p.storeId)).slice().reverse();
    if (sf) rows = rows.filter(p => p.storeId===sf);
    document.getElementById('purchListBody').innerHTML = renderPurchasesTable(rows);
}
function openPurchaseModal(){
    const u = currentUser();
    const myStores = getMyStoreObjects(u);
    if (myStores.length === 0) { toast('No stores in scope.', 'error'); return; }
    if (DB.items.length === 0) { toast('Add items first.', 'error'); return; }
    const storeOptions = myStores.length === 1
        ? `<option value="${myStores[0].id}" selected>${esc(storeLabel(myStores[0].id))}</option>`
        : myStores.map(s => `<option value="${s.id}">${s.code} — ${esc(s.name)}</option>`).join('');
    window._workingPurchase = { storeId: myStores[0].id, date: todayISO(), supplier:'', lines:[] };
    openModal('New Purchase', `
        <div class="form-grid">
            <div class="form-row"><label>Date</label><input type="date" id="pDate" value="${todayISO()}"></div>
            <div class="form-row"><label>Supplier</label><input id="pSupplier"></div>
        </div>
        <div class="form-row"><label>Store</label><select id="pStore" onchange="window._workingPurchase.storeId=this.value">${storeOptions}</select></div>
        <div class="form-row"><label style="display:flex;justify-content:space-between"><span>Items</span>
            <button type="button" class="btn-light btn-sm" onclick="addPurchaseLine()">+ Add</button></label>
            <div class="line-editor"><table><thead><tr><th>Item</th><th>Qty</th><th>UOM</th><th>Cost</th><th></th></tr></thead>
            <tbody id="purchaseLines"></tbody></table></div></div>
    `, `<button class="btn-light" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="savePurchase()">Save</button>`);
    addPurchaseLine();
}
function addPurchaseLine(){ window._workingPurchase.lines.push({ itemId:'', qty:0, uom:'', cost:0 }); renderPurchaseLines(); }
function removePurchaseLine(idx){ window._workingPurchase.lines.splice(idx, 1); renderPurchaseLines(); }
function renderPurchaseLines(){
    const lines = window._workingPurchase.lines;
    document.getElementById('purchaseLines').innerHTML = lines.map((l, idx) => {
        const item = getItem(l.itemId);
        return `<tr>
            <td><select onchange="updatePurchaseLine(${idx},'itemId',this.value)">
                <option value="">—</option>
                ${DB.items.filter(i => i.status==='Active').map(i => `<option value="${i.id}" ${i.id===l.itemId?'selected':''}>${esc(i.code)} — ${esc(i.name)}</option>`).join('')}
            </select></td>
            <td><input type="number" step="0.01" value="${l.qty}" oninput="updatePurchaseLine(${idx},'qty',this.value)"></td>
            <td><input value="${esc(item?item.uom:l.uom)}" readonly style="background:#f9fafb"></td>
            <td><input type="number" step="0.01" value="${l.cost || (item?item.cost:0)}" oninput="updatePurchaseLine(${idx},'cost',this.value)"></td>
            <td><button type="button" class="btn-danger btn-xs" onclick="removePurchaseLine(${idx})">✕</button></td></tr>`;
    }).join('');
}
function updatePurchaseLine(idx, field, value){
    const l = window._workingPurchase.lines[idx];
    if (field==='qty' || field==='cost') l[field] = Number(value)||0;
    else l[field] = value;
    if (field==='itemId') { const it = getItem(value); if (it) { l.uom = it.uom; l.cost = it.cost; } renderPurchaseLines(); }
}
function savePurchase(){
    const p = window._workingPurchase;
    p.supplier = document.getElementById('pSupplier').value.trim();
    p.date = document.getElementById('pDate').value;
    if (!isInScope(p.storeId)) { toast('Access denied.', 'error'); return; }
    const valid = p.lines.filter(l => l.itemId && l.qty > 0);
    if (valid.length === 0) { toast('No valid lines', 'error'); return; }
    const u = currentUser();
    const id = nextMovementId('PO', DB.purchases, p.date);
    DB.purchases.push({
        id, storeId:p.storeId, date:p.date, supplier:p.supplier,
        lines: valid.map(l => ({ itemId:l.itemId, qty:l.qty, uom:l.uom, cost:l.cost||0 })),
        byId:u.id, byName:u.name, status:'Posted', createdAt:nowISO()
    });
    saveData(); window._workingPurchase = null; closeModal();
    toast(`Purchase ${id} saved`, 'success'); showPage('purchases');
}

function exportJournalsCSV(){

    }));
