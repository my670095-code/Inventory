function exportDailyVarianceCSV(){
    const myStoreIds = new Set(getMyStores());
    const rows = DB.journals.filter(j => myStoreIds.has(j.storeId) && j.type === 'daily');
    if (rows.length === 0) { toast('Nothing','error'); return; }
    const out = [['Journal','Date','Store','Item Code','Item','UOM','Opening','Purchases','Transfers In','Transfers Out','Consumption','Expected','Physical','Variance','Value Impact','By']];
    rows.forEach(j => j.lines.forEach(l => {
        const it = getItem(l.itemId);
        const valueImpact = (l.variance||0) * (it ? it.cost : 0);
        out.push([j.id, j.date, storeLabel(j.storeId), it?it.code:'', it?it.name:'', l.uom, l.opening, l.purchases, l.transfersIn||0, l.transfersOut||0, l.consumption, l.expected, l.physical, l.variance, valueImpact.toFixed(2), j.byName]);
    }));
    downloadCSV(out, 'daily_variance.csv');
}
function exportTransfersCSV(){
    if (DB.transfers.length === 0) { toast('Nothing','error'); return; }
    const out = [['Transfer No','Date','From Store','To Store','Item Code','Item','UOM','Qty','Status','Requested By','Approved By','Approved At']];
    DB.transfers.forEach(t => t.lines.forEach(l => {
        const it = getItem(l.itemId);
        out.push([t.id, t.date, storeLabel(t.fromStoreId), storeLabel(t.toStoreId), it?it.code:'', it?it.name:'', l.uom, l.qty, t.status, t.byName, t.approvedByName||'', t.approvedAt ? new Date(t.approvedAt).toLocaleString() : '']);
    }));
    downloadCSV(out, 'transfers.csv');
}
function downloadCSV(rows, filename){
    const csv = rows.map(r => r.map(c => `"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    toast('Exported '+filename, 'success');
}
function exportFullBackup(){
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `drcafe_erp_backup_${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded', 'success');
}

                    <button class="btn-danger btn-xs" onclick="purgeVoided('${v.id}')">Purge</button>
                </td></tr>`).join('')}</tbody></table>`;
}
function emptyRecycleBin(){
    if (DB.voidedRecords.length === 0) { toast('Already empty', 'error'); return; }

    DB.voidedRecords = [];
    saveData(); toast('Recycle bin emptied', 'success'); showPage('recycle');
}

        <div class="panel-header"><div class="panel-title">Danger Zone</div></div>
        <div class="panel-body">
            <button class="btn-danger" onclick="resetAllData()">Reset All Data</button>
        </div>
    </div>`;
};
function restoreFromFile(evt){
    const file = evt.target.files[0];
    if (!file) return;
    if (!confirm('Replace all data?')) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const d = JSON.parse(e.target.result);
            if (!isValidData(d)) throw new Error('Invalid file');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
            toast('Restored', 'success');
            setTimeout(()=>location.reload(), 800);
        } catch(err) { toast('Invalid: '+err.message, 'error'); }
    };
    reader.readAsText(file);
    evt.target.value = '';
}
function resetAllData(){
    if (!confirm('Reset ALL? Cannot undo.')) return;
    if (!confirm('Really?')) return;
    LEGACY_KEYS.concat([STORAGE_KEY]).forEach(k => localStorage.removeItem(k));
    clearSession(); location.reload();
}

/* ---------- MODAL ---------- */
function openModal(title, body, footer){
    const mb = document.getElementById('modalBox');
    mb.className = 'modal';
    document.getElementById('modalTitle').innerHTML = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modalFooter').innerHTML = footer || '<button class="btn-light" onclick="closeModal()">Close</button>';
    document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
    document.getElementById('modalOverlay').classList.remove('show');
    document.getElementById('modalBox').className = 'modal';
}



document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
    document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('loginPass').focus(); });
    document.getElementById('modalOverlay').addEventListener('click', e => { if (e.target.id==='modalOverlay') closeModal(); });

    try {
        if (CLOUD_MODE === 'local') {
            DB = await loadData();
        }
        await bootApp();
    } catch(e) {
        console.error('Boot error:', e);
        alert('Startup error: ' + (e.message || e));
    }
});
</script>
